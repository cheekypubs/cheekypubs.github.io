<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root { --cream:#FFF5EE; --red:#C0392B; --brown:#5C4033; --peach:#FFE4D1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1080px; height:{{H}}px; background:var(--cream); font-family:'Lora',Georgia,serif; color:var(--brown); overflow:hidden; }
  .art { position:absolute; top:0; left:0; width:1080px; height:{{ART_H}}px; background:url("{{ART}}") center/cover no-repeat; }
  .art::after { content:""; position:absolute; inset:auto 0 0 0; height:120px; background:linear-gradient(to bottom, transparent, rgba(0,0,0,.25)); }
  .panel { position:absolute; top:{{ART_H}}px; left:0; width:1080px; bottom:0; background:var(--cream); border-top:8px solid var(--red); padding:44px 72px 0; }
  .tags { display:flex; gap:12px; margin-bottom:20px; }
  .tag { background:var(--peach); color:var(--red); font-weight:600; font-size:24px; padding:6px 18px; border-radius:999px; }
  h1 { font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:68px; line-height:1.05; color:var(--red); margin-bottom:10px; }
  .by { font-style:italic; font-size:30px; margin-bottom:22px; }
  .desc { font-size:29px; line-height:1.42; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; max-width:936px; }
  .footer { position:absolute; left:72px; right:72px; bottom:{{FOOTBOT}}px; display:flex; align-items:center; justify-content:space-between; }
  .cta { font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:34px; color:var(--brown); }
  .cta span { color:var(--red); }
  .logo { height:120px; mix-blend-mode:multiply; }
.badge { display:{{BADGE_DISPLAY}}; position:absolute; left:72px; top:{{BADGE_TOP}}px; background:var(--red); color:var(--cream); font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:44px; letter-spacing:.06em; text-transform:uppercase; padding:16px 36px; border-radius:999px; border:4px solid var(--peach); box-shadow:0 8px 24px rgba(0,0,0,.35); }
</style></head>
<body>
  <div class="art"></div>
  <div class="badge">{{BADGE}}</div>
  <div class="panel">
    <div class="tags">{{TAGS}}</div>
    <h1>{{TITLE}}</h1>
    <div class="by">by {{AUTHOR}}</div>
    <div class="desc">{{DESCRIPTION}}</div>
    <div class="footer">
      <div class="cta">Read it free at <span>cheeky.pub</span></div>
      <img class="logo" src="{{LOGO}}">
    </div>
  </div>
</body></html>
